<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim your free key — KM Panel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0a0a0a; color: #f2f2f2;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box { background: #151515; border: 1px solid #262626; border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  .key { font-family: monospace; background: #1e1e1e; border-radius: 8px; padding: 10px 12px; margin: 10px 0; user-select: all; font-size: 0.95rem; }
  .success { color: #34d399; }
  .error { color: #f87171; }
  a { color: #ccc; font-size: 0.85rem; }
  .hint { color: #777; font-size: 0.8rem; margin-top: 6px; }
</style>
</head>
<body>
<div class="box" id="box">Verifying...</div>

<script>
  const box = document.getElementById('box');
  const params = new URLSearchParams(window.location.search);
  const hash = params.get('hash');

  if (!hash) {
    box.innerHTML = '<h1 class="error">Couldn\'t verify</h1><p>No verification hash found in the URL.</p><a href="/">Back to home</a>';
  } else {
    fetch('/api/claim-free-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hash })
    })
      .then(async (res) => {
        const data = await res.json();
        if (res.ok) {
          box.innerHTML = `
            <h1 class="success">Here's your free key</h1>
            <div class="key">${data.key}</div>
            <p class="hint">Valid for 48 hours.</p>
            <a href="/">Go use it</a>
          `;
        } else {
          box.innerHTML = `<h1 class="error">Couldn't verify</h1><p>${data.error || 'Please try again.'}</p><a href="/">Back to home</a>`;
        }
      })
      .catch(() => {
        box.innerHTML = '<h1 class="error">Network error</h1><p>Please try again.</p><a href="/">Back to home</a>';
      });
  }
</script>
</body>
</html>
